version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fvs-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fvs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fvs_password}
      POSTGRES_DB: ${POSTGRES_DB:-face_voting_system}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fvs_user} -d ${POSTGRES_DB:-face_voting_system}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: fvs-server
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fvs_user}:${POSTGRES_PASSWORD:-fvs_password}@postgres:5432/${POSTGRES_DB:-face_voting_system}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30m}
      NODE_ENV: production
      PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@facevoting.local}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: fvs-client
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api/v1}
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  postgres_data: